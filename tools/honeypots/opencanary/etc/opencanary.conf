{
    "device.node_id": "cyberbluesoc-canary",
    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",
    "http.enabled": true,
    "http.port": 80,
    "http.banner": "Apache/2.4.41 (Ubuntu)",
    "http.skin": "nasLogin",
    "imap.enabled": true,
    "imap.port": 143,
    "imap.banner": "* OK IMAP4rev1 ready",
    "mssql.enabled": true,
    "mssql.port": 1433,
    "mssql.version": "2012",
    "vnc.enabled": true,
    "vnc.port": 5900,
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                },
                "file": {
                    "class": "logging.handlers.RotatingFileHandler",
                    "filename": "/var/log/opencanary/opencanary.log",
                    "maxBytes": 10485760,
                    "backupCount": 5
                }
            }
        }
    }
}
